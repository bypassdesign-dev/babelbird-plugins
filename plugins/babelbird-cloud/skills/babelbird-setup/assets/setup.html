<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="填写一次 API Key，连接巴别鸟与 Codex。">
  <meta name="robots" content="noindex, nofollow">
  <title>连接巴别鸟</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="setup.css">
  <script src="setup.js" defer></script>
</head>
<body>
  <main class="panel">
    <p class="brand">巴别鸟 · Codex</p>
    <h1>连接巴别鸟</h1>
    <p class="intro">填写一次 API Key，其他设置交给我们。</p>
    <form id="connect-form">
      <label for="api-key">巴别鸟 API Key</label>
      <input id="api-key" name="apiKey" type="password" placeholder="在这里粘贴 API Key" required maxlength="4096" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="privacy">
      <p id="privacy" class="hint">密钥保存在这台电脑，不会发到聊天中。</p>
      <button type="submit" id="submit">保存并连接</button>
    </form>
    <div id="result" role="status" aria-live="polite" tabindex="-1" hidden></div>
    <div id="acquire" class="acquire">
      <p>还没有密钥？<a href="https://www.babel.cc/" target="_blank" rel="noopener noreferrer">打开巴别鸟获取</a></p>
      <p class="hint">在「设置 → API秘钥」创建密钥，复制 APIKey 后回到这里。</p>
    </div>
    <p class="footnote">这是本机设置页，10 分钟内有效。</p>
  </main>
</body>
</html>
